name: Hospital Defense checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js tests/*.test.cjs; do node --check "$file"; done
      - name: Run game model and UI-contract tests
        run: node --test tests/*.test.cjs
